openapi: "3.0.3"
info:
  title: CareerNexus 求职网站 API
  description: |
    求职网站后端接口文档，供前端开发和 Swagger 调试使用。

    **用户角色**:
    - `JOB_SEEKER` — 求职用户
    - `ENTERPRISE` — 企业用户
    - `ADMIN` — 管理员

    **认证方式**: 除注册和登录外，所有接口需在 Header 中携带 JWT Token:
    ```
    Authorization: Bearer <token>
    ```

    **统一响应格式**: 所有接口均返回 HTTP 200，业务结果由 `code` 字段区分：
    - `code: 1` — 成功，数据在 `data` 字段
    - `code: 0` — 失败，错误信息在 `msg` 字段

    **分页说明**: 分页接口统一使用 `page`（页码，从 1 开始）和 `size`（每页条数）参数，返回 `PaginatedResult`。
  version: "1.0.0"
  contact:
    name: CareerNexus Dev Team

servers:
  - url: http://localhost:8080/api
    description: 开发环境 (直连后端)
  - url: http://localhost/api
    description: nginx 代理环境

tags:
  - name: Auth
    description: 系统管理 — 用户注册、登录、注销、修改密码
  - name: Admin
    description: 管理后台 — 仪表盘、用户管理、系统统计
  - name: Profile
    description: 档案管理 — 用户档案的建立、修改、保存、查询
  - name: Jobs
    description: 职位管理 — 企业发布/管理职位，职位浏览与详情
  - name: Search
    description: 信息查询 — 模糊查询职位和求职者
  - name: Subscription
    description: 信息互动 — 订阅、匹配推送、通知
  - name: Reports
    description: 行业动态 — 分析报告、薪资趋势、需求分布
  - name: Forum
    description: 求职论坛 — 分类、帖子、评论、点赞

# ============================================================
# 公共数据模型
# ============================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录后获取的 JWT Token

  schemas:
    # --- 通用 ---
    ApiResponse:
      type: object
      required: [code]
      properties:
        code:
          type: integer
          description: |
            业务状态码。
            **1** — 成功，数据在 `data` 字段
            **0** — 失败，错误信息在 `msg` 字段
          enum: [1, 0]
        msg:
          type: string
          description: 提示信息（失败时包含错误原因）
        data:
          description: 响应数据（成功时返回）

    PaginatedResult:
      type: object
      properties:
        total:
          type: integer
          description: 总记录数
        page:
          type: integer
          description: 当前页码
        size:
          type: integer
          description: 每页大小
        records:
          type: array
          description: 数据列表

    # --- 用户 ---
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        userType:
          type: string
          enum: [JOB_SEEKER, ENTERPRISE, ADMIN]
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 6
          maxLength: 32

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Token
        user:
          $ref: '#/components/schemas/User'

    RegisterJobSeekerRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 6
          maxLength: 32
        email:
          type: string
          format: email
        phone:
          type: string

    RegisterEnterpriseRequest:
      type: object
      required: [username, password, email, companyName]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 6
          maxLength: 32
        email:
          type: string
          format: email
        phone:
          type: string
        companyName:
          type: string

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
          maxLength: 32

    # --- 档案 ---
    JobSeekerProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        realName:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE]
        birthDate:
          type: string
          format: date
        major:
          type: string
        education:
          type: string
          enum: [HIGH_SCHOOL, ASSOCIATE, BACHELOR, MASTER, PHD]
        school:
          type: string
        graduationYear:
          type: integer
        workExperience:
          type: integer
          description: 工作年限
        expectedSalary:
          type: integer
          description: 期望薪资（月薪/元）
        skills:
          type: string
          description: 技能标签，逗号分隔
        selfDescription:
          type: string
          description: 自我描述
        resumeUrl:
          type: string
          description: 简历文件路径

    EnterpriseProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        companyName:
          type: string
        industry:
          type: string
        companySize:
          type: string
        companyDescription:
          type: string
        contactPerson:
          type: string
        contactPhone:
          type: string
        address:
          type: string
        website:
          type: string

    # --- 职位 ---
    JobPosting:
      type: object
      properties:
        id:
          type: integer
        enterpriseUserId:
          type: integer
        enterpriseName:
          type: string
        title:
          type: string
        description:
          type: string
        requiredMajor:
          type: string
        minExperience:
          type: integer
        maxExperience:
          type: integer
        minSalary:
          type: integer
        maxSalary:
          type: integer
        location:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED]
        createdAt:
          type: string
          format: date-time

    JobPostingRequest:
      type: object
      required: [title, description, location]
      properties:
        title:
          type: string
        description:
          type: string
        requiredMajor:
          type: string
        minExperience:
          type: integer
        maxExperience:
          type: integer
        minSalary:
          type: integer
        maxSalary:
          type: integer
        location:
          type: string

    # --- 订阅 ---
    Subscription:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        keywords:
          type: string
          description: 关键词，逗号分隔
        major:
          type: string
        minSalary:
          type: integer
        workExperience:
          type: integer
        location:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SubscriptionRequest:
      type: object
      properties:
        keywords:
          type: string
        major:
          type: string
        minSalary:
          type: integer
        workExperience:
          type: integer
        location:
          type: string

    Notification:
      type: object
      properties:
        id:
          type: integer
        subscriptionId:
          type: integer
        jobId:
          type: integer
        jobTitle:
          type: string
        companyName:
          type: string
        matchedAt:
          type: string
          format: date-time
        isRead:
          type: boolean

    # --- 报告 ---
    IndustryReport:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        industry:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        summary:
          type: string
        content:
          type: string
          description: Markdown 格式内容
        generatedAt:
          type: string
          format: date-time

    SalaryTrend:
      type: object
      properties:
        period:
          type: string
        avgSalary:
          type: integer
        jobCount:
          type: integer

    DemandDistribution:
      type: object
      properties:
        label:
          type: string
        count:
          type: integer
        percentage:
          type: number

    # --- 论坛 ---
    ForumCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string

    ForumPost:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        categoryName:
          type: string
        userId:
          type: integer
        username:
          type: string
        title:
          type: string
        content:
          type: string
        likeCount:
          type: integer
        commentCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ForumPostRequest:
      type: object
      required: [categoryId, title, content]
      properties:
        categoryId:
          type: integer
        title:
          type: string
        content:
          type: string

    ForumComment:
      type: object
      properties:
        id:
          type: integer
        postId:
          type: integer
        userId:
          type: integer
        username:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    ForumCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    # --- Admin 仪表盘 ---
    DashboardStats:
      type: object
      properties:
        jobCount:
          type: integer
          description: 职位总数
        reportCount:
          type: integer
          description: 行业报告总数
        postCount:
          type: integer
          description: 论坛帖子总数
        userCount:
          type: integer
          description: 注册用户总数

    SystemOverview:
      type: object
      properties:
        jobsOpen:
          type: integer
          description: 开放中的职位数
        jobsClosed:
          type: integer
          description: 已关闭的职位数
        reportsGenerated:
          type: integer
          description: 本月生成报告数
        postsThisMonth:
          type: integer
          description: 本月新增帖子数

# ============================================================
# API 路径定义
# ============================================================
paths:
  # ========================
  # 1. 系统管理 /api/auth
  # ========================
  /auth/register/job-seeker:
    post:
      tags: [Auth]
      summary: 求职用户注册
      operationId: registerJobSeeker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterJobSeekerRequest'
      responses:
        '200':
          description: |
            注册结果。
            - `code: 1` — 注册成功，`data` 为 User 对象
            - `code: 0` — 用户名或邮箱已存在

  /auth/register/enterprise:
    post:
      tags: [Auth]
      summary: 企业用户注册
      operationId: registerEnterprise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEnterpriseRequest'
      responses:
        '200':
          description: |
            注册结果。
            - `code: 1` — 注册成功，`data` 为 User 对象
            - `code: 0` — 用户名或邮箱已存在

  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            登录结果。
            - `code: 1` — 登录成功，`data` 为 LoginResponse（含 token 和 user）
            - `code: 0` — 用户名或密码错误

  /auth/logout:
    post:
      tags: [Auth]
      summary: 用户注销（服务端可选实现，前端已做客户端清除）
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 注销成功

  /auth/me:
    get:
      tags: [Auth]
      summary: 获取当前登录用户信息
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: |
            查询结果。
            - `code: 1` — 成功，`data` 为 User 对象
            - `code: 0` — Token 无效或已过期

  /auth/password:
    put:
      tags: [Auth]
      summary: 修改密码
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: |
            修改结果。
            - `code: 1` — 修改成功
            - `code: 0` — 旧密码错误

  /auth/account:
    delete:
      tags: [Auth]
      summary: 注销账号（软删除，状态改为 INACTIVE）
      operationId: deactivateAccount
      security:
        - BearerAuth: []
      responses:
        '200':
          description: |
            注销结果。
            - `code: 1` — 账号已注销
            - `code: 0` — 操作失败

  # ========================
  # 2. 管理后台 /api/admin
  # ========================
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: (管理员) 获取仪表盘统计数据
      operationId: getDashboardStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: |
            统计数据。
            - `code: 1` — 成功，`data` 为 DashboardStats

  /admin/overview:
    get:
      tags: [Admin]
      summary: (管理员) 获取系统概览
      operationId: getSystemOverview
      security:
        - BearerAuth: []
      responses:
        '200':
          description: |
            系统概览数据。
            - `code: 1` — 成功，`data` 为 SystemOverview

  /auth/users:
    get:
      tags: [Admin]
      summary: (管理员) 获取用户列表
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: userType
          in: query
          schema:
            type: string
            enum: [JOB_SEEKER, ENTERPRISE]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
      responses:
        '200':
          description: |
            用户列表。
            - `code: 1` — 成功，`data` 为 PaginatedResult<User>

  /auth/users/{userId}/status:
    put:
      tags: [Admin]
      summary: (管理员) 启用/禁用用户
      operationId: updateUserStatus
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
      responses:
        '200':
          description: |
            操作结果。
            - `code: 1` — 状态更新成功
            - `code: 0` — 操作失败

  # ========================
  # 3. 档案管理 /api/profiles
  # ========================
  /profiles/job-seeker:
    put:
      tags: [Profile]
      summary: 创建或更新求职者档案
      operationId: saveJobSeekerProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSeekerProfile'
      responses:
        '200':
          description: |
            保存结果。
            - `code: 1` — 保存成功，`data` 为 JobSeekerProfile

  /profiles/enterprise:
    put:
      tags: [Profile]
      summary: 创建或更新企业档案
      operationId: saveEnterpriseProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnterpriseProfile'
      responses:
        '200':
          description: |
            保存结果。
            - `code: 1` — 保存成功，`data` 为 EnterpriseProfile

  /profiles/me:
    get:
      tags: [Profile]
      summary: 获取当前用户的档案
      operationId: getMyProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: |
            查询结果。
            - `code: 1` — 成功，`data` 为 JobSeekerProfile 或 EnterpriseProfile（根据用户类型）
            - `code: 0` — 档案不存在

  /profiles/user/{userId}:
    get:
      tags: [Profile]
      summary: 根据用户 ID 获取公开档案
      operationId: getProfileByUserId
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            查询结果。
            - `code: 1` — 成功，`data` 为 JobSeekerProfile 或 EnterpriseProfile
            - `code: 0` — 档案不存在

  /profiles/resume/upload:
    post:
      tags: [Profile]
      summary: 求职者上传简历文件
      operationId: uploadResume
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF/DOC/DOCX，最大 10MB
      responses:
        '200':
          description: |
            上传结果。
            - `code: 1` — 上传成功，`data` 为 `{ url: string }`
            - `code: 0` — 上传失败

  # ========================
  # 4. 职位管理 /api/jobs
  # ========================
  /jobs:
    get:
      tags: [Jobs]
      summary: 获取职位列表（浏览 / 最新职位）
      description: |
        按条件分页查询职位。所有参数可选，空参数返回最新职位。
        求职者浏览首页最新职位时调用。
      operationId: listJobs
      parameters:
        - name: keyword
          in: query
          description: 关键词（匹配标题和描述）
          schema:
            type: string
        - name: major
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: minSalary
          in: query
          schema:
            type: integer
        - name: status
          in: query
          description: 默认只返回 OPEN 的职位
          schema:
            type: string
            enum: [OPEN, CLOSED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: |
            职位列表。
            - `code: 1` — 成功，`data` 为 PaginatedResult<JobPosting>

    post:
      tags: [Jobs]
      summary: (企业) 发布职位
      operationId: createJob
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPostingRequest'
      responses:
        '200':
          description: |
            发布结果。
            - `code: 1` — 发布成功，`data` 为 JobPosting
            - `code: 0` — 仅企业用户可发布职位

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: 获取职位详情
      operationId: getJobDetail
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            职位详情。
            - `code: 1` — 成功，`data` 为 JobPosting
            - `code: 0` — 职位不存在
    put:
      tags: [Jobs]
      summary: (企业) 更新职位（仅发布者本人）
      operationId: updateJob
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPostingRequest'
      responses:
        '200':
          description: |
            更新结果。
            - `code: 1` — 更新成功，`data` 为 JobPosting
            - `code: 0` — 无权限或职位不存在
    delete:
      tags: [Jobs]
      summary: (企业) 删除职位（仅发布者本人或管理员）
      operationId: deleteJob
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            删除结果。
            - `code: 1` — 删除成功
            - `code: 0` — 无权限或职位不存在

  /jobs/my:
    get:
      tags: [Jobs]
      summary: (企业) 获取我发布的职位列表
      operationId: getMyJobs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, CLOSED]
      responses:
        '200':
          description: |
            我的职位列表。
            - `code: 1` — 成功，`data` 为 PaginatedResult<JobPosting>

  # ========================
  # 5. 信息查询 /api/search
  # ========================
  /search/jobs:
    get:
      tags: [Search]
      summary: 模糊搜索职位（核心搜索接口）
      description: |
        支持按关键词、专业、工作经验、薪资范围、地点进行模糊查询。
        所有参数可选，空参数不参与过滤。
      operationId: searchJobs
      parameters:
        - name: keyword
          in: query
          description: 关键词（匹配职位标题和描述）
          schema:
            type: string
        - name: major
          in: query
          description: 专业要求
          schema:
            type: string
        - name: minExperience
          in: query
          description: 最低工作年限
          schema:
            type: integer
        - name: maxExperience
          in: query
          description: 最高工作年限
          schema:
            type: integer
        - name: minSalary
          in: query
          description: 最低薪资
          schema:
            type: integer
        - name: maxSalary
          in: query
          description: 最高薪资
          schema:
            type: integer
        - name: location
          in: query
          description: 工作地点
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: |
            搜索结果。
            - `code: 1` — 成功，`data` 为 PaginatedResult<JobPosting>

  /search/job-seekers:
    get:
      tags: [Search]
      summary: (企业) 搜索求职者
      description: 按专业、学历、工作经验、技能搜索求职者档案。
      operationId: searchJobSeekers
      security:
        - BearerAuth: []
      parameters:
        - name: major
          in: query
          schema:
            type: string
        - name: education
          in: query
          schema:
            type: string
            enum: [HIGH_SCHOOL, ASSOCIATE, BACHELOR, MASTER, PHD]
        - name: minExperience
          in: query
          schema:
            type: integer
        - name: skills
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: |
            搜索结果。
            - `code: 1` — 成功，`data` 为 PaginatedResult（含 JobSeekerProfile 列表）

  /search/stats:
    get:
      tags: [Search]
      summary: 搜索统计（供行业报告使用）
      description: 搜索统计数据（平均薪资、专业分布等）
      operationId: getSearchStats
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 统计数据（平均薪资、专业分布等）

  # ========================
  # 6. 信息互动 /api/subscriptions
  # ========================
  /subscriptions:
    get:
      tags: [Subscription]
      summary: 获取我的订阅列表
      operationId: getSubscriptions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: |
            订阅列表。
            - `code: 1` — 成功，`data` 为 Subscription[]
    post:
      tags: [Subscription]
      summary: 创建订阅
      operationId: createSubscription
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '200':
          description: |
            创建结果。
            - `code: 1` — 创建成功，`data` 为 Subscription

  /subscriptions/{subId}:
    put:
      tags: [Subscription]
      summary: 更新订阅
      operationId: updateSubscription
      security:
        - BearerAuth: []
      parameters:
        - name: subId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '200':
          description: |
            更新结果。
            - `code: 1` — 更新成功
    delete:
      tags: [Subscription]
      summary: 删除订阅
      operationId: deleteSubscription
      security:
        - BearerAuth: []
      parameters:
        - name: subId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            删除结果。
            - `code: 1` — 删除成功

  /subscriptions/{subId}/toggle:
    put:
      tags: [Subscription]
      summary: 启用/禁用订阅
      operationId: toggleSubscription
      security:
        - BearerAuth: []
      parameters:
        - name: subId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: |
            操作结果。
            - `code: 1` — 操作成功

  /subscriptions/{subId}/matches:
    get:
      tags: [Subscription]
      summary: 获取订阅匹配的职位
      operationId: getSubscriptionMatches
      security:
        - BearerAuth: []
      parameters:
        - name: subId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: |
            匹配结果。
            - `code: 1` — 成功，`data` 为 PaginatedResult<JobPosting>

  /subscriptions/notifications:
    get:
      tags: [Subscription]
      summary: 获取推送通知列表
      operationId: getNotifications
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: read
          in: query
          description: 按已读/未读筛选
          schema:
            type: boolean
      responses:
        '200':
          description: |
            通知列表。
            - `code: 1` — 成功，`data` 为 PaginatedResult<Notification>

  /subscriptions/notifications/{notificationId}/read:
    put:
      tags: [Subscription]
      summary: 标记通知为已读
      operationId: markNotificationRead
      security:
        - BearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            操作结果。
            - `code: 1` — 标记成功

  /subscriptions/notifications/unread-count:
    get:
      tags: [Subscription]
      summary: 获取未读通知数
      operationId: getUnreadCount
      security:
        - BearerAuth: []
      responses:
        '200':
          description: |
            未读数。
            - `code: 1` — 成功，`data` 为未读通知数量（number）

  # ========================
  # 7. 行业动态 /api/reports
  # ========================
  /reports:
    get:
      tags: [Reports]
      summary: 获取行业报告列表
      operationId: getReports
      parameters:
        - name: industry
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: |
            报告列表。
            - `code: 1` — 成功，`data` 为 PaginatedResult<IndustryReport>

  /reports/generate:
    post:
      tags: [Reports]
      summary: (管理员/系统) 触发生成行业报告
      description: 触发生成指定行业的分析报告。
      operationId: generateReport
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [industry]
              properties:
                industry:
                  type: string
                periodStart:
                  type: string
                  format: date
                periodEnd:
                  type: string
                  format: date
      responses:
        '200':
          description: |
            生成结果。
            - `code: 1` — 生成成功

  /reports/{reportId}:
    get:
      tags: [Reports]
      summary: 获取报告详情
      operationId: getReportDetail
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            报告详情。
            - `code: 1` — 成功，`data` 为 IndustryReport
            - `code: 0` — 报告不存在

  /reports/salary-trends:
    get:
      tags: [Reports]
      summary: 获取薪资趋势数据
      operationId: getSalaryTrends
      parameters:
        - name: industry
          in: query
          schema:
            type: string
        - name: major
          in: query
          schema:
            type: string
      responses:
        '200':
          description: |
            薪资趋势数据。
            - `code: 1` — 成功，`data` 为 SalaryTrend[]

  /reports/demand-distribution:
    get:
      tags: [Reports]
      summary: 获取需求分布数据（按专业/地点/经验）
      operationId: getDemandDistribution
      parameters:
        - name: type
          in: query
          description: 分布维度
          schema:
            type: string
            enum: [MAJOR, LOCATION, EXPERIENCE]
      responses:
        '200':
          description: |
            需求分布数据。
            - `code: 1` — 成功，`data` 为 DemandDistribution[]

  # ========================
  # 8. 求职论坛 /api/forum
  # ========================
  /forum/categories:
    get:
      tags: [Forum]
      summary: 获取论坛分类列表
      operationId: getCategories
      responses:
        '200':
          description: |
            分类列表。
            - `code: 1` — 成功，`data` 为 ForumCategory[]
    post:
      tags: [Forum]
      summary: (管理员) 创建分类
      description: 创建新的论坛分类。
      operationId: createCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumCategory'
      responses:
        '200':
          description: |
            创建结果。
            - `code: 1` — 创建成功

  /forum/posts:
    get:
      tags: [Forum]
      summary: 获取帖子列表
      operationId: getPosts
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: keyword
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          description: 排序方式
          schema:
            type: string
            enum: [latest, popular]
            default: latest
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: |
            帖子列表。
            - `code: 1` — 成功，`data` 为 PaginatedResult<ForumPost>
    post:
      tags: [Forum]
      summary: 发布帖子
      operationId: createPost
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumPostRequest'
      responses:
        '200':
          description: |
            发布结果。
            - `code: 1` — 发布成功，`data` 为 ForumPost

  /forum/posts/my:
    get:
      tags: [Forum]
      summary: 获取我的帖子
      operationId: getMyPosts
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: |
            我的帖子列表。
            - `code: 1` — 成功，`data` 为 PaginatedResult<ForumPost>

  /forum/posts/{postId}:
    get:
      tags: [Forum]
      summary: 获取帖子详情（含评论列表）
      operationId: getPostDetail
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            帖子详情 + 评论列表。
            - `code: 1` — 成功，`data` 为 `{ post: ForumPost, comments: ForumComment[] }`
            - `code: 0` — 帖子不存在
    put:
      tags: [Forum]
      summary: 编辑帖子（仅作者本人）
      operationId: updatePost
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumPostRequest'
      responses:
        '200':
          description: |
            编辑结果。
            - `code: 1` — 编辑成功，`data` 为 ForumPost
            - `code: 0` — 无权限或帖子不存在
    delete:
      tags: [Forum]
      summary: 删除帖子（作者本人或管理员）
      operationId: deletePost
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            删除结果。
            - `code: 1` — 删除成功
            - `code: 0` — 无权限或帖子不存在

  /forum/posts/{postId}/like:
    post:
      tags: [Forum]
      summary: 点赞/取消点赞帖子（Toggle 模式）
      operationId: likePost
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            点赞结果。
            - `code: 1` — 操作成功

  /forum/posts/{postId}/comments:
    post:
      tags: [Forum]
      summary: 评论帖子
      operationId: createComment
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumCommentRequest'
      responses:
        '200':
          description: |
            评论结果。
            - `code: 1` — 评论成功，`data` 为 ForumComment

  /forum/comments/{commentId}:
    delete:
      tags: [Forum]
      summary: 删除评论（作者本人或管理员）
      operationId: deleteComment
      security:
        - BearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            删除结果。
            - `code: 1` — 删除成功
            - `code: 0` — 无权限或评论不存在

# ============================================================
# 全局安全设置（默认所有接口需要认证；注册/登录除外）
# ============================================================
security:
  - BearerAuth: []
